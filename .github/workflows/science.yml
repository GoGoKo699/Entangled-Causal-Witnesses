name: Scientific checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            numpy: '1.26.4'
          - python: '3.12'
            numpy: '2.3.5'
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install NumPy
        run: python -m pip install 'numpy==${{ matrix.numpy }}'
      - name: Reproduce finite scientific checks
        run: python verification/validate.py --write-results /tmp/causal-witness-results.json
